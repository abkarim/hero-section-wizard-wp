name: Release

on:
    workflow_dispatch:
    push:
      branches:
        - master
       
permissions:
    contents: write

jobs:
    build:
        name: Release
        runs-on: ubuntu-latest

        steps:
            - name: Checkout 🛎️
              uses: actions/checkout@v4

            - name: Setup node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "lts/*"

            - name: Install dependencies
              run: npm ci
              
            - name: Build
              run: npm run build

            - name: Extract Plugin
              run: npm run extract

            - name: Read package version
              id: version
              run: |
                  echo "version=$(jq -r .version package.json)" >> $GITHUB_OUTPUT
                          
            - name: Upload file
              uses: svenstaro/upload-release-action@v2
              with:
                  repo_token: ${{ github.token }}
                  file: ./hero-section-wizard.zip
                  asset_name: hero-section-wizard-${{ steps.version.outputs.version }}.zip
                  tag: v${{ steps.version.outputs.version }}
                  release_name: "hero-section-wizard v${{ steps.version.outputs.version }}"
                  overwrite: true